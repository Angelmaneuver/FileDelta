name: Build and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/filedelta

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          BINARY=filedelta
          if [ "$GOOS" = windows ]; then BINARY=filedelta.exe; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$BINARY" ./cmd/filedelta
          ARCHIVE="filedelta_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd dist && zip "${ARCHIVE}.zip" "$BINARY")
          else
            (cd dist && tar -czf "${ARCHIVE}.tar.gz" "$BINARY")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: filedelta-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/filedelta_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
  
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
